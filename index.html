<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Tracker — Sample index.html App</title>
  <style>
    :root{
      --bg:#0f172a; --panel:#111827; --muted:#94a3b8; --text:#e5e7eb; --accent:#22c55e; --danger:#ef4444; --border:#1f2937;
      --shadow: 0 10px 25px rgba(0,0,0,.35);
    }
    [data-theme="light"]{
      --bg:#f8fafc; --panel:#ffffff; --muted:#475569; --text:#0f172a; --accent:#16a34a; --danger:#dc2626; --border:#e5e7eb;
      --shadow: 0 10px 25px rgba(2,6,23,.08);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 600px at 80% -10%, rgba(34,197,94,.12), transparent 60%), var(--bg);
      color:var(--text); display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .app{ width: min(920px, 100%); display:grid; gap:16px; }
    header{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
    h1{ font-size: clamp(22px, 4vw, 32px); margin:0; letter-spacing:.3px }
    .theme-toggle{ border:1px solid var(--border); background:transparent; color:var(--text); padding:8px 12px; border-radius:12px; cursor:pointer }

    .card{ background:var(--panel); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); }

    .row{ display:flex; gap:8px; }
    .pad{ padding:14px; }
    .input{ flex:1; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:transparent; color:var(--text); outline:none }
    .btn{ padding:12px 14px; border:none; border-radius:12px; background:var(--accent); color:white; cursor:pointer; font-weight:600 }
    .btn:disabled{ opacity:.6; cursor:not-allowed }
    .btn.secondary{ background:transparent; border:1px solid var(--border); color:var(--text) }
    .btn.danger{ background:var(--danger) }

    .toolbar{ display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; align-items:center; }
    .filters{ display:flex; gap:6px; }
    .chip{ padding:8px 12px; border-radius:999px; border:1px solid var(--border); cursor:pointer; user-select:none }
    .chip.active{ background:var(--accent); border-color:transparent; color:white }

    ul{ list-style:none; margin:0; padding:0 }
    li{ display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; padding:12px 14px; border-top:1px solid var(--border) }
    li:first-child{ border-top:none }
    .task{ display:flex; align-items:center; gap:10px }
    .task input[type="checkbox"]{ width:18px; height:18px }
    .task label{ user-select:none }
    .task.done label{ text-decoration: line-through; color:var(--muted) }

    .item-actions{ display:flex; gap:6px }
    .item-actions button{ background:transparent; border:1px solid var(--border); color:var(--text); padding:6px 8px; border-radius:10px; cursor:pointer }
    .empty{ text-align:center; padding:36px; color:var(--muted) }

    footer{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:12px 14px; border-top:1px solid var(--border); color:var(--muted) }

    /* small niceties */
    .kbd{ font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; border:1px solid var(--border); padding:2px 6px; border-radius:6px; }
    .hint{ color:var(--muted); font-size:13px }
  </style>
</head>
<body data-theme="dark">
  <main class="app">
    <header>
      <h1>Task Tracker <span class="hint">• single‑file demo</span></h1>
      <button class="theme-toggle" id="themeBtn" title="Toggle theme">☀️/🌙</button>
    </header>

    <section class="card pad">
      <div class="row">
        <input id="taskInput" class="input" type="text" placeholder="Add a task and hit Enter…" autocomplete="off" />
        <button id="addBtn" class="btn" disabled>Add</button>
      </div>
      <div class="hint" style="margin-top:8px">Pro tip: Press <span class="kbd">Enter</span> to add, <span class="kbd">E</span> to edit, <span class="kbd">Del</span> to remove.</div>
    </section>

    <section class="card">
      <div class="pad toolbar">
        <div class="filters" id="filters">
          <span class="chip active" data-filter="all">All</span>
          <span class="chip" data-filter="active">Active</span>
          <span class="chip" data-filter="done">Completed</span>
        </div>
        <div class="row">
          <input id="search" class="input" placeholder="Search tasks…" />
          <button id="clearDone" class="btn secondary">Clear Completed</button>
        </div>
      </div>
      <ul id="list"></ul>
      <footer>
        <span id="count">0 items</span>
        <small>Data stored locally • No backend</small>
      </footer>
    </section>
  </main>

  <template id="itemTemplate">
    <li>
      <div class="task"><input type="checkbox"><label></label></div>
      <input class="input" hidden>
      <div class="item-actions">
        <button class="edit">Edit</button>
        <button class="remove">Delete</button>
      </div>
    </li>
  </template>

  <script>
    const $ = (sel, el=document) => el.querySelector(sel);
    const $$ = (sel, el=document) => [...el.querySelectorAll(sel)];

    const state = {
      items: JSON.parse(localStorage.getItem('tasks:v1')||'[]'),
      filter: 'all',
      query: ''
    };

    const els = {
      input: $('#taskInput'), add: $('#addBtn'), list: $('#list'), count: $('#count'),
      clearDone: $('#clearDone'), filters: $('#filters'), search: $('#search'), themeBtn: $('#themeBtn')
    };

    // Theme toggle
    els.themeBtn.addEventListener('click', () => {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
    });
    // load saved theme
    const savedTheme = localStorage.getItem('theme');
    if(savedTheme) document.body.setAttribute('data-theme', savedTheme);

    // Input enable/disable
    const toggleAddEnabled = () => {
      els.add.disabled = !els.input.value.trim();
    };
    els.input.addEventListener('input', toggleAddEnabled);

    // Add Task
    const addTask = (text) => {
      state.items.push({ id: crypto.randomUUID(), text, done:false, created: Date.now() });
      save();
      render();
    };

    els.add.addEventListener('click', () => {
      const v = els.input.value.trim();
      if(!v) return; addTask(v); els.input.value=''; toggleAddEnabled(); els.input.focus();
    });
    els.input.addEventListener('keydown', e => {
      if(e.key === 'Enter') els.add.click();
    });

    // Clear completed
    els.clearDone.addEventListener('click', () => {
      state.items = state.items.filter(x => !x.done); save(); render();
    });

    // Filters
    els.filters.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip'); if(!chip) return;
      state.filter = chip.dataset.filter; $$('.chip', els.filters).forEach(c => c.classList.toggle('active', c===chip));
      render();
    });

    // Search
    els.search.addEventListener('input', () => { state.query = els.search.value.toLowerCase(); render(); });

    function save(){ localStorage.setItem('tasks:v1', JSON.stringify(state.items)); }

    function filtered(){
      let items = [...state.items];
      if(state.filter === 'active') items = items.filter(i=>!i.done);
      if(state.filter === 'done') items = items.filter(i=>i.done);
      if(state.query) items = items.filter(i=> i.text.toLowerCase().includes(state.query));
      return items.sort((a,b)=> a.done - b.done || a.created - b.created);
    }

    function render(){
      const items = filtered();
      els.list.innerHTML = '';
      if(items.length === 0){
        const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'No tasks yet. Add one above!';
        li.style.gridTemplateColumns = '1fr'; els.list.appendChild(li);
      } else {
        for(const item of items){
          const li = $('#itemTemplate').content.firstElementChild.cloneNode(true);
          const row = $('.task', li); const cb = $('input[type="checkbox"]', li); const label = $('label', li);
          const editInput = $('input.input', li); const btnEdit = $('.edit', li); const btnRemove = $('.remove', li);
          label.textContent = item.text; cb.checked = item.done; if(item.done) row.classList.add('done');

          cb.addEventListener('change', () => { item.done = cb.checked; save(); render(); });

          // Edit inline
          const startEdit = () => { editInput.value = item.text; editInput.hidden=false; label.hidden=true; editInput.focus(); editInput.setSelectionRange(item.text.length, item.text.length); };
          const finishEdit = (commit) => {
            if(commit){ const val = editInput.value.trim(); if(val){ item.text = val; } }
            editInput.hidden=true; label.hidden=false; save(); render();
          };
          btnEdit.addEventListener('click', startEdit);
          li.addEventListener('keydown', (e)=>{
            if(e.key==='e' || e.key==='E'){ e.preventDefault(); startEdit(); }
            if(e.key==='Enter') finishEdit(true);
            if(e.key==='Escape') finishEdit(false);
            if(e.key==='Delete'){ e.preventDefault(); removeItem(); }
          });
          editInput.addEventListener('blur', ()=>finishEdit(true));

          const removeItem = () => { state.items = state.items.filter(x=>x.id!==item.id); save(); render(); };
          btnRemove.addEventListener('click', removeItem);

          els.list.appendChild(li);
        }
      }
      const remaining = state.items.filter(i=>!i.done).length;
      els.count.textContent = `${remaining} item${remaining===1?'':'s'} left`;
    }

    // Boot
    render(); toggleAddEnabled();
  </script>
</body>
</html>
